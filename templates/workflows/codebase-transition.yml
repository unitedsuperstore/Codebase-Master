name: Codebase transition checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "CODEBASE_MAP.md"
      - "AI_HANDOFF.md"
      - ".github/codebase-master-checks.json"
      - ".github/workflows/codebase-transition.yml"
      - "scripts/validate_transition.py"
      - "tests/**"
      - "templates/**"
      - "skills/codebase-transition-kit/**"
  push:
    branches: [main]
    paths:
      - "CODEBASE_MAP.md"
      - "AI_HANDOFF.md"
      - ".github/codebase-master-checks.json"
      - ".github/workflows/codebase-transition.yml"
      - "scripts/validate_transition.py"
      - "tests/**"
      - "templates/**"
      - "skills/codebase-transition-kit/**"

permissions:
  contents: read

concurrency:
  group: codebase-transition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transition-check:
    name: Validate handoff and configured project health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate transition documents and run configured checks
        run: python3 scripts/validate_transition.py --run-health-checks --checks-config .github/codebase-master-checks.json

      - name: Alert on failed transition checks
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "::error title=Codebase transition checks failed::Review the failed validation and configured health-check logs."
          {
            echo "## Codebase transition checks failed"
            echo
            echo "The architecture-map/handoff validation or a configured project health check failed."
            echo "Review the [GitHub Actions run](${RUN_URL}) for the failing command and logs."
            echo "GitHub email/inbox delivery follows each user's repository and Actions notification settings."
          } >> "$GITHUB_STEP_SUMMARY"
